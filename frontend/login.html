<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Job Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:      #0f172a;
            --surface: #1e293b;
            --border:  #334155;
            --accent:  #3b82f6;
            --accent2: #6366f1;
            --text:    #f8fafc;
            --muted:   #94a3b8;
            --error:   #f87171;
            --success: #34d399;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* animated background */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.1;
            animation: drift 14s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        .b1 { width: 500px; height: 500px; background: var(--accent);  top: -150px; left: -150px; }
        .b2 { width: 400px; height: 400px; background: var(--accent2); bottom: -100px; right: -100px; animation-delay: 5s; }
        .b3 { width: 260px; height: 260px; background: #06b6d4; top: 40%; left: 46%; animation-delay: 2.5s; }
        @keyframes drift {
            from { transform: translate(0,0) scale(1); }
            to   { transform: translate(25px, 18px) scale(1.05); }
        }

        /* card */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(30,41,59,0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 50px 44px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
        }

        /* logo */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 36px;
        }
        .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(59,130,246,0.3);
        }
        .logo-text { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }

        h2 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.6px;
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 34px;
        }

        /* fields */
        .field { margin-bottom: 20px; }
        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.7px;
            margin-bottom: 8px;
        }
        .input-wrap { position: relative; }
        .input-wrap .icon {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            pointer-events: none;
            opacity: 0.7;
        }
        .input-wrap input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(15,23,42,0.6);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-wrap input::placeholder { color: #475569; }
        .input-wrap input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .toggle-pw {
            position: absolute;
            right: 13px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            color: var(--muted); cursor: pointer;
            font-size: 15px; padding: 4px;
            transition: color 0.2s;
        }
        .toggle-pw:hover { color: var(--text); }

        /* button */
        .btn {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff; border: none;
            border-radius: 10px;
            font-size: 15px; font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer; margin-top: 6px;
            transition: opacity 0.2s, transform 0.1s;
            min-height: 46px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(59,130,246,0.25);
        }
        .btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
        .btn:active:not(:disabled) { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* messages */
        .msg {
            margin-top: 14px; padding: 11px 14px;
            border-radius: 8px; font-size: 13px;
            display: none; align-items: center; gap: 8px;
        }
        .msg-error {
            background: rgba(248,113,113,0.1);
            border: 1px solid rgba(248,113,113,0.2);
            color: var(--error);
        }
        .msg-success {
            background: rgba(52,211,153,0.1);
            border: 1px solid rgba(52,211,153,0.2);
            color: var(--success);
        }

        /* divider */
        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 26px 0 20px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: var(--border);
        }
        .divider span { font-size: 12px; color: var(--muted); }

        .foot { text-align: center; font-size: 14px; color: var(--muted); }
        .foot a { color: var(--accent); text-decoration: none; font-weight: 500; }
        .foot a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div class="card">
    <div class="logo">
        <div class="logo-icon">📋</div>
        <span class="logo-text">Job Tracker</span>
    </div>

    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to manage your job applications</p>

    <div class="field">
        <label>Username</label>
        <div class="input-wrap">
            <span class="icon">👤</span>
            <input type="text" id="username" placeholder="Enter your username" autocomplete="username" />
        </div>
    </div>

    <div class="field">
        <label>Password</label>
        <div class="input-wrap">
            <span class="icon">🔒</span>
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
            <button class="toggle-pw" type="button" onclick="togglePw()" tabindex="-1">👁</button>
        </div>
    </div>

    <button class="btn" id="login-btn" onclick="handleLogin()">
        <span id="btn-label">Sign In</span>
        <div class="spinner" id="spinner"></div>
    </button>

    <div class="msg msg-error" id="error-msg">
        <span>⚠️</span><span id="error-text"></span>
    </div>
    <div class="msg msg-success" id="success-msg">
        <span>✅</span><span>Login successful! Redirecting...</span>
    </div>

    <div class="divider"><span>or</span></div>
    <p class="foot">Don't have an account? <a href="/register.html">Register</a></p>
</div>

<script src="/auth.js"></script>
</body>
</html>
